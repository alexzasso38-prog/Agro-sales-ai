# Ambiente locale con PostgreSQL. Rimane una DEMO senza invii esterni.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agro
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro_local_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agro:agro_local_demo@db:5432/agro
      DEMO_MODE: "true"
      ALLOW_EXTERNAL_INTEGRATIONS: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://agro:agro_local_demo@db:5432/agro
      DEMO_MODE: "true"
      ALLOW_EXTERNAL_INTEGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
